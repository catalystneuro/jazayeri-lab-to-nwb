NWBFile:
  # related_publications: # no pubs yet
  session_description:
    Data from macaque performing the H-Maze task. Subject is
    presented with an H-shaped maze and three temporal cues indicating a change in the 
    movement direction of an occluded ball as it travels through the maze. 
    Subject should use the three temporal cues and the shape
    of the maze to infer the final exit point of the occluded ball.
    Subjects respond by saccading to the final exit point it thinks the ball is at.
  institution: MIT
  lab: Jazayeri
  experimenter:
    - Ramadan, Mahdi
Subject:
  species: Macaca mulatta
